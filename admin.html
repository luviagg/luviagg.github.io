<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — CS 1.6 CFG Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/webp" href="img/1.webp">
  <style>
    body {
      background: var(--bg-deep);
      color: var(--text-1);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
      overflow-y: auto;
    }
    .admin-container {
      width: 100%;
      max-width: 900px;
      background: rgba(13, 17, 23, 0.95);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 32px;
      box-shadow: var(--shadow-pop);
    }
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 24px;
    }
    .admin-title {
      font-family: var(--font-head);
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .admin-section {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 20px;
      margin-bottom: 24px;
    }
    .section-card {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .section-card-header {
      display: grid;
      grid-template-columns: 1.5fr 1fr 40px;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
    }
    .admin-section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-1);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
    }
    .form-input, .form-textarea, .form-select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--text-1);
      padding: 10px 14px;
      font-family: var(--font-code);
      font-size: 13px;
      outline: none;
      transition: border-color var(--t-fast);
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--accent);
    }
    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }
    .link-row {
      display: grid;
      grid-template-columns: 60px 1.2fr 1.5fr 40px;
      gap: 10px;
      align-items: center;
      background: rgba(255,255,255,0.02);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 8px;
    }
    .btn-icon {
      background: rgba(255, 68, 102, 0.15);
      border: 1px solid rgba(255, 68, 102, 0.3);
      color: var(--red);
      border-radius: 6px;
      height: 36px;
      width: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: background 0.15s ease;
    }
    .btn-icon:hover {
      background: rgba(255, 68, 102, 0.3);
    }
    .btn-add {
      background: rgba(0, 255, 136, 0.12);
      border: 1px solid rgba(0, 255, 136, 0.3);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-add:hover {
      background: rgba(0, 255, 136, 0.25);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #00cc6a);
      color: #000;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: var(--r-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 255, 136, 0.25);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .btn-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .status-msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: var(--r-sm);
      font-size: 13px;
      display: none;
    }
    .status-msg.success {
      display: block;
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid rgba(0, 255, 136, 0.4);
      color: var(--accent);
    }
    .status-msg.error {
      display: block;
      background: rgba(255, 68, 102, 0.15);
      border: 1px solid rgba(255, 68, 102, 0.4);
      color: var(--red);
    }
  </style>
</head>
<body>

  <div class="admin-container">
    
    <div class="admin-header">
      <div class="admin-title">
        <span>⚙️</span> Panel de Administración Modular de Secciones & Redes
      </div>
      <a href="./" style="color: var(--text-2); text-decoration: none; font-size: 13px; font-weight: 500;">← Volver al sitio</a>
    </div>

    <!-- SECCIÓN: GESTOR DE SECCIONES MODULARES -->
    <div class="admin-section">
      <div class="admin-section-title">
        <span>📂 Secciones Personalizadas (Redes, Proyectos, Enlaces, etc.)</span>
        <button type="button" id="btn-add-section" class="btn-add">➕ Crear Nueva Sección</button>
      </div>

      <div id="sections-container">
        <!-- Renderizado dinámico de Secciones y sus Botones/Links -->
      </div>
    </div>

    <!-- SECCIÓN: PUBLICIDAD & ADSENSE -->
    <div class="admin-section">
      <div class="admin-section-title">
        <span>📢 Configuración de Publicidad (Google AdSense)</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="adsense-client">ID de Cliente Google AdSense (ca-pub):</label>
        <input class="form-input" type="text" id="adsense-client" value="ca-pub-3295246390356947" placeholder="ca-pub-XXXXXXXXXXXXXXXX">
      </div>
    </div>

    <!-- SECCIÓN: ANTI-ADBLOCK CONFIG -->
    <div class="admin-section">
      <div class="admin-section-title">
        <span>🛡️ Configuración Anti-AdBlocker</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="adblock-title">Título del Modal:</label>
        <input class="form-input" type="text" id="adblock-title" value="Bloqueador de Anuncios Detectado">
      </div>

      <div class="form-group">
        <label class="form-label" for="adblock-msg">Mensaje Principal:</label>
        <textarea class="form-textarea" id="adblock-msg">Para que la aplicación funcione correctamente y puedas usar los generadores, herramientas y descargas al 100%, por favor desactiva tu AdBlocker / Anti-Publicidad en este sitio.</textarea>
      </div>
    </div>

    <!-- BOTÓN PUBLICAR EN GITHUB -->
    <button type="button" id="btn-deploy" class="btn-submit">
      <span>🚀</span> GUARDAR Y PUBLICAR DIRECTO EN GITHUB
    </button>

    <div id="deploy-status" class="status-msg"></div>

  </div>

  <script>
    // Estructura de secciones modulares completas
    let sectionsData = [
      {
        id: 'sec-social',
        title: 'Redes Sociales',
        styleColor: 'neon-pink-text',
        links: [
          { icon: '📱', label: 'TikTok', url: 'https://www.tiktok.com/@luvia.gg' },
          { icon: '📸', label: 'Instagram', url: 'https://www.instagram.com/luvia.gg' },
          { icon: '👥', label: 'Facebook', url: 'https://www.facebook.com/LuviaFace/' },
          { icon: '🐦', label: 'X (Twitter)', url: 'https://x.com/luvia_gg' },
          { icon: '💬', label: 'Discord (Luviagg)', url: 'https://discord.gg/Luviagg' }
        ]
      },
      {
        id: 'sec-projects',
        title: 'Proyectos',
        styleColor: 'neon-cyan-text',
        links: [
          { icon: '🛠️', label: 'CSCFGBuilder', url: '#' }
        ]
      }
    ];

    function renderSections() {
      const container = document.getElementById('sections-container');
      container.innerHTML = sectionsData.map((sec, secIdx) => `
        <div class="section-card">
          <div class="section-card-header">
            <div>
              <label class="form-label">Título de la Sección:</label>
              <input type="text" class="form-input" value="${sec.title}" placeholder="ej: Redes Sociales, Mis Canales..." onchange="sectionsData[${secIdx}].title = this.value">
            </div>
            <div>
              <label class="form-label">Estilo / Color Neon:</label>
              <select class="form-select" onchange="sectionsData[${secIdx}].styleColor = this.value">
                <option value="neon-pink-text" ${sec.styleColor === 'neon-pink-text' ? 'selected' : ''}>💖 Neón Rosa</option>
                <option value="neon-cyan-text" ${sec.styleColor === 'neon-cyan-text' ? 'selected' : ''}>🩵 Neón Cyan</option>
                <option value="neon-green-text" ${sec.styleColor === 'neon-green-text' ? 'selected' : ''}>💚 Neón Verde</option>
                <option value="neon-yellow-text" ${sec.styleColor === 'neon-yellow-text' ? 'selected' : ''}>💛 Neón Amarillo</option>
              </select>
            </div>
            <button type="button" class="btn-icon" onclick="removeSection(${secIdx})" title="Eliminar Sección Completa">🗑️</button>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span style="font-size: 12px; font-weight: 600; color: var(--text-2);">Enlaces / Botones de esta sección:</span>
            <button type="button" class="btn-add" onclick="addLinkToSection(${secIdx})">➕ Agregar Botón</button>
          </div>

          <div id="links-container-${secIdx}">
            ${sec.links.map((link, linkIdx) => `
              <div class="link-row">
                <input type="text" class="form-input" value="${link.icon}" placeholder="Icono" onchange="sectionsData[${secIdx}].links[${linkIdx}].icon = this.value">
                <input type="text" class="form-input" value="${link.label}" placeholder="Nombre" onchange="sectionsData[${secIdx}].links[${linkIdx}].label = this.value">
                <input type="text" class="form-input" value="${link.url}" placeholder="URL / Enlace" onchange="sectionsData[${secIdx}].links[${linkIdx}].url = this.value">
                <button type="button" class="btn-icon" onclick="removeLinkFromSection(${secIdx}, ${linkIdx})" title="Eliminar Botón">🗑️</button>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function addLinkToSection(secIdx) {
      sectionsData[secIdx].links.push({ icon: '🔗', label: 'Nuevo Enlace', url: 'https://' });
      renderSections();
    }

    function removeLinkFromSection(secIdx, linkIdx) {
      sectionsData[secIdx].links.splice(linkIdx, 1);
      renderSections();
    }

    function removeSection(secIdx) {
      if (confirm(`¿Eliminar la sección "${sectionsData[secIdx].title}" completa?`)) {
        sectionsData.splice(secIdx, 1);
        renderSections();
      }
    }

    document.getElementById('btn-add-section').addEventListener('click', () => {
      sectionsData.push({
        id: 'sec-' + Date.now(),
        title: 'Nueva Sección',
        styleColor: 'neon-cyan-text',
        links: [
          { icon: '⭐', label: 'Enlace 1', url: 'https://' }
        ]
      });
      renderSections();
    });

    // Cargar render inicial
    renderSections();

    // Guardar y publicar
    document.getElementById('btn-deploy').addEventListener('click', async () => {
      const statusDiv = document.getElementById('deploy-status');
      const btn = document.getElementById('btn-deploy');

      btn.disabled = true;
      btn.innerHTML = '⏳ Guardando secciones y preparando publicación...';
      statusDiv.className = 'status-msg';
      statusDiv.style.display = 'none';

      try {
        const saveRes = await fetch('/api/save-networks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sections: sectionsData,
            adsenseClient: document.getElementById('adsense-client').value,
            adblockTitle: document.getElementById('adblock-title').value,
            adblockMsg: document.getElementById('adblock-msg').value
          })
        });

        const res = await fetch('/api/publish-github', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        const data = await res.json();

        if (res.ok && data.success) {
          statusDiv.className = 'status-msg success';
          statusDiv.innerText = '✅ ' + data.message;
        } else {
          throw new Error(data.message || data.details || 'Error al publicar.');
        }

      } catch (err) {
        statusDiv.className = 'status-msg error';
        statusDiv.innerText = `❌ Error: ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🚀 GUARDAR Y PUBLICAR DIRECTO EN GITHUB';
      }
    });
  </script>

</body>
</html>
