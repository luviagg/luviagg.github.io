<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — CS 1.6 CFG Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/webp" href="img/1.webp">
  <style>
    body {
      background: var(--bg-deep);
      color: var(--text-1);
      font-family: var(--font-ui);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
      overflow-y: auto;
    }
    .admin-container {
      width: 100%;
      max-width: 800px;
      background: rgba(13, 17, 23, 0.95);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 32px;
      box-shadow: var(--shadow-pop);
    }
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 24px;
    }
    .admin-title {
      font-family: var(--font-head);
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .admin-section {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 20px;
      margin-bottom: 24px;
    }
    .admin-section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-1);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group:last-child {
      margin-bottom: 0;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
    }
    .form-input, .form-textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--text-1);
      padding: 10px 14px;
      font-family: var(--font-code);
      font-size: 13px;
      outline: none;
      transition: border-color var(--t-fast);
    }
    .form-input:focus, .form-textarea:focus {
      border-color: var(--accent);
    }
    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #00cc6a);
      color: #000;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: var(--r-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 255, 136, 0.25);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .btn-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .status-msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: var(--r-sm);
      font-size: 13px;
      display: none;
    }
    .status-msg.success {
      display: block;
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid rgba(0, 255, 136, 0.4);
      color: var(--accent);
    }
    .status-msg.error {
      display: block;
      background: rgba(255, 68, 102, 0.15);
      border: 1px solid rgba(255, 68, 102, 0.4);
      color: var(--red);
    }
  </style>
</head>
<body>

  <div class="admin-container">
    
    <div class="admin-header">
      <div class="admin-title">
        <span>⚙️</span> Panel de Administración & Deploy GitHub
      </div>
      <a href="./" style="color: var(--text-2); text-decoration: none; font-size: 13px; font-weight: 500;">← Volver al sitio</a>
    </div>

    <!-- SECCIÓN 1: PUBLICIDAD & ADSENSE -->
    <div class="admin-section">
      <div class="admin-section-title">
        <span>📢</span> Configuración de Publicidad (Google AdSense)
      </div>

      <div class="form-group">
        <label class="form-label" for="adsense-client">ID de Cliente Google AdSense (ca-pub):</label>
        <input class="form-input" type="text" id="adsense-client" value="ca-pub-3295246390356947" placeholder="ca-pub-XXXXXXXXXXXXXXXX">
      </div>
    </div>

    <!-- SECCIÓN 2: ANTI-ADBLOCK CONFIG -->
    <div class="admin-section">
      <div class="admin-section-title">
        <span>🛡️</span> Configuración Anti-AdBlocker
      </div>

      <div class="form-group">
        <label class="form-label" for="adblock-title">Título del Modal:</label>
        <input class="form-input" type="text" id="adblock-title" value="Bloqueador de Anuncios Detectado">
      </div>

      <div class="form-group">
        <label class="form-label" for="adblock-msg">Mensaje Principal:</label>
        <textarea class="form-textarea" id="adblock-msg">Para que la aplicación funcione correctamente y puedas usar los generadores, herramientas y descargas al 100%, por favor desactiva tu AdBlocker / Anti-Publicidad en este sitio.</textarea>
      </div>
    </div>

    <!-- BOTÓN PUBLICAR EN GITHUB -->
    <button type="button" id="btn-deploy" class="btn-submit">
      <span>🚀</span> GUARDAR Y PUBLICAR DIRECTO EN GITHUB
    </button>

    <div id="deploy-status" class="status-msg"></div>

  </div>

  <script>
    document.getElementById('btn-deploy').addEventListener('click', async () => {
      const statusDiv = document.getElementById('deploy-status');
      const btn = document.getElementById('btn-deploy');

      btn.disabled = true;
      btn.innerHTML = '⏳ Preparando publicación y abriendo selector de cuentas de GitHub...';
      statusDiv.className = 'status-msg';
      statusDiv.style.display = 'none';

      try {
        const res = await fetch('/api/publish-github', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        const data = await res.json();

        if (res.ok && data.success) {
          statusDiv.className = 'status-msg success';
          statusDiv.innerText = '✅ ' + data.message;
        } else {
          throw new Error(data.message || data.details || 'Error al publicar.');
        }

      } catch (err) {
        statusDiv.className = 'status-msg error';
        statusDiv.innerText = `❌ Error: ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🚀 GUARDAR Y PUBLICAR DIRECTO EN GITHUB';
      }
    });
  </script>

</body>
</html>
